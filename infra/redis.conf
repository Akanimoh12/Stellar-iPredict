# ─────────────────────────────────────────────────────────────────────────────
# iPredict — production Redis configuration
#
# Mounted read-only at /usr/local/etc/redis/redis.conf by
# docker-compose.production.yml and passed to redis-server as the config file.
# Values given on the command line (e.g. --requirepass) override this file, so
# secrets stay in the environment and never land in a tracked file.
#
# What Redis holds for iPredict (see backend/src/cache/):
#   - cache-aside reads of markets, bets, leaderboard, stats  (TTL'd)
#   - per-route rate-limiter counters                          (TTL'd, EVAL)
#   - negative-cache markers for unknown ids                   (TTL'd)
#
# Every one of those is *regenerable* from Postgres, so Redis is not a system
# of record. Persistence is still configured, for one reason: a cold restart
# with an empty keyspace sends every in-flight request to Postgres and the
# Soroban RPC at once. Warm restarts are an availability feature here, not a
# durability one — which is what sets the fsync policy chosen below.
# ─────────────────────────────────────────────────────────────────────────────

# ── Network ──────────────────────────────────────────────────────────────────
# Bind every interface: the only clients are other containers on the compose
# network, reached by service DNS. Reachability is constrained by the network
# and by requirepass (supplied via --requirepass from REDIS_PASSWORD), not by
# the bind address.
bind * -::*
protected-mode yes
port 6379
tcp-backlog 511

# Never drop an idle connection: the API and indexer hold long-lived pooled
# clients that can sit quiet between bursts.
timeout 0
tcp-keepalive 300

# ── General ──────────────────────────────────────────────────────────────────
daemonize no
loglevel notice
# Empty logfile = stdout, so `docker compose logs redis` works.
logfile ""
databases 16

# ── RDB snapshots ────────────────────────────────────────────────────────────
# Point-in-time snapshots. These are what infra/scripts/backup.sh copies, and
# what makes a restart cheap when the AOF has just been rewritten.
#
#   save <seconds> <changed keys>
save 900 1
save 300 10
save 60 10000

# A failed background save must NOT start rejecting writes. For a durable
# store `yes` is right; for a regenerable cache it converts a disk hiccup into
# a full API outage. The failure is still visible in the log and in
# rdb_last_bgsave_status via INFO — alert on that instead.
stop-writes-on-bgsave-error no

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
rdb-del-sync-files no

# Must match the container's persistent volume mount.
dir /data

# ── Append-only file ─────────────────────────────────────────────────────────
# AOF is the primary recovery path: it bounds data loss to ~1s instead of to
# the last snapshot, so a restart resumes with a warm keyspace.
appendonly yes
appendfilename "appendonly.aof"
# Redis 7 multi-part AOF: base + incr files live in this directory under `dir`.
appenddirname "appendonlydir"

# everysec, deliberately:
#   always  — fsync per write. Costs a disk round-trip on the hot cache path
#             to protect data that Postgres can regenerate. Not worth it.
#   everysec— at most ~1s of writes lost on a hard kill. Correct trade here.
#   no      — leaves durability to the OS; loses an unbounded window.
appendfsync everysec

# Keep fsyncing during a rewrite. Setting this to `yes` avoids a latency spike
# on slow disks but widens the loss window to the whole rewrite; with the data
# being regenerable we prefer the steady, predictable behaviour.
no-appendfsync-on-rewrite no

# Rewrite when the AOF doubles, never below 64mb (avoids rewrite churn on a
# small keyspace right after a flush or a cold start).
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# A truncated tail (the classic result of a power loss mid-append) should be
# trimmed and logged, not turned into a boot failure.
aof-load-truncated yes

# Write the rewrite base as RDB rather than replaying commands: smaller file
# and a much faster load at startup.
aof-use-rdb-preamble yes
aof-timestamp-enabled no

# ── Memory ───────────────────────────────────────────────────────────────────
# Cap the keyspace so Redis can never be the reason the host OOMs. Raise this
# together with the container's memory limit in docker-compose.production.yml.
maxmemory 512mb

# allkeys-lru, not volatile-lru: everything here is a regenerable cache entry,
# and volatile-* would return OOM errors once only untyped keys remain. Under
# pressure we would rather lose the coldest cache entry than fail a write.
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Reserve headroom for client output buffers separately from the data cap
# (Redis 7+), so a slow consumer cannot evict the whole keyspace.
maxmemory-clients 5%

# ── Lazy freeing ─────────────────────────────────────────────────────────────
# Free large values on a background thread. Keeps eviction and expiry off the
# command path, which is what protects p99 latency under cache pressure.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes
replica-lazy-flush yes

# ── Client output buffers ────────────────────────────────────────────────────
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ── Slow queries ─────────────────────────────────────────────────────────────
# Anything over 10ms in a pure in-memory cache is worth looking at.
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# ── Safety ───────────────────────────────────────────────────────────────────
# Administrative commands that can reconfigure or crash the server stay off.
# The rate limiter uses EVAL, so scripting is deliberately left enabled.
enable-protected-configs no
enable-debug-command no
enable-module-command no
