name: Certificate expiry monitor

# External watchdog for the TLS certificate monitor:
#  * runs daily and after manual dispatch,
#  * sends the 30/14/7-day alerts through the configured webhook,
#  * fails the run on a critical finding (<=7 days, expired, check failed or
#    monitor gap) — a failed scheduled workflow is itself an alert, because
#    GitHub notifies everyone who watches the repository.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-certificates:
    name: Check certificate expiry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore monitor state (alert de-duplication)
        uses: actions/cache/restore@v4
        with:
          path: infra/cert-monitor/.state.json
          key: cert-monitor-state-${{ github.run_id }}
          restore-keys: |
            cert-monitor-state-

      - name: Self-test the monitor
        run: python3 infra/cert-monitor/check-certs.py --self-test

      - name: Check every endpoint
        id: check
        env:
          CERT_MONITOR_WEBHOOK_URL: ${{ secrets.CERT_MONITOR_WEBHOOK_URL }}
          CERT_MONITOR_WEBHOOK_FORMAT: ${{ vars.CERT_MONITOR_WEBHOOK_FORMAT || 'slack' }}
          CERT_MONITOR_HEARTBEAT_URL: ${{ secrets.CERT_MONITOR_HEARTBEAT_URL }}
        run: |
          python3 infra/cert-monitor/check-certs.py \
            --state-file infra/cert-monitor/.state.json \
            --fail-on critical \
            --json > cert-report.json

      - name: Publish report to the job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = "cert-report.json"
          if not os.path.exists(path):
              print("no report produced", file=sys.stderr)
              raise SystemExit(0)
          rep = json.load(open(path))
          lines = ["## Certificate expiry report", ""]
          lines += ["| endpoint | scope | target | expires (UTC) | days | status | verify |",
                    "|---|---|---|---|---|---|---|"]
          for r in rep["results"]:
              exp = (r["expires"] or "-")[:16].replace("T", " ")
              days = "-" if r["days_left"] is None else r["days_left"]
              lines.append(f"| {r['endpoint']} | {r['scope']} | `{r['target']}` | {exp} "
                           f"| {days} | {r['status']} | {r['verify']} |")
          if rep["pending"]:
              lines += ["", "**Pending (not yet deployed, not checked):** "
                        + ", ".join(rep["pending"])]
          if rep["watchdog"]:
              lines += ["", f"> **Watchdog:** {rep['watchdog']}"]
          alerts = rep["alerts"]
          lines += ["", f"**{len(alerts)} alert(s)** this run."]
          for a in alerts:
              lines.append(f"- `{a['endpoint']}` — **{a['level']}** — {a['reason']}")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          PY

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: infra/cert-monitor/.state.json
          key: cert-monitor-state-${{ github.run_id }}
