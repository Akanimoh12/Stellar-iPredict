# Local monitoring infrastructure: Prometheus + Grafana
# Use this to set up monitoring for local development and testing

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ipredict-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    extra_hosts:
      # Map host.docker.internal to the host gateway so Prometheus can scrape
      # app services running on the host during local development (backend
      # :4000, indexer metrics :9091). Harmless on Docker Desktop, required
      # on Linux where host.docker.internal does not exist by default.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ipredict-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--config.expand-env=true'
    ports:
      - "9093:9093"
    environment:
      # Default to a no-op local sink so the stack starts without secrets; set
      # these in infra/.env for real deliveries (see .env.monitoring.example).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://host.docker.internal:8090/ipredict-alerts}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ipredict-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      # Dashboard JSON files get their own provisioning directory. Mounting
      # them INTO the ./grafana/dashboards dir mount above nests a file mount
      # inside a directory mount, which breaks container startup on Docker
      # Desktop (virtiofs) and is fragile elsewhere. dashboards.yml points its
      # file provider at this directory.
      - ./grafana/business.json:/etc/grafana/provisioning/dashboards-json/business.json:ro
      - ./grafana/oracle.json:/etc/grafana/provisioning/dashboards-json/oracle.json:ro
      - ./grafana/system.json:/etc/grafana/provisioning/dashboards-json/system.json:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
