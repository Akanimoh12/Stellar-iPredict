x-runtime-policy: &runtime-policy
  restart: always
  logging: &central-logging
    driver: fluentd
    options:
      fluentd-address: "127.0.0.1:24224"
      fluentd-async: "true"
      tag: "ipredict.{{.Name}}"

services:
  api:
    <<: *runtime-policy
    image: "${IMAGE_REGISTRY:-ghcr.io/akanimoh12}/ipredict-api:${API_IMAGE_TAG:-local}"
    build:
      context: ../backend
    cpus: "1.00"
    mem_limit: 512m
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  indexer:
    <<: *runtime-policy
    image: "${IMAGE_REGISTRY:-ghcr.io/akanimoh12}/ipredict-indexer:${INDEXER_IMAGE_TAG:-local}"
    build:
      context: ../indexer
      dockerfile: src/Dockerfile
    cpus: "0.75"
    mem_limit: 384m
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379
      SOROBAN_RPC_URL: "${SOROBAN_RPC_URL:-https://mainnet.sorobanrpc.com}"
      NETWORK_PASSPHRASE: "${NETWORK_PASSPHRASE:-Public Global Stellar Network ; September 2015}"
      MARKET_CONTRACT_ID: "${MARKET_CONTRACT_ID:-not-configured}"
      TOKEN_CONTRACT_ID: "${TOKEN_CONTRACT_ID:-not-configured}"
      REFERRAL_CONTRACT_ID: "${REFERRAL_CONTRACT_ID:-not-configured}"
      LEADERBOARD_CONTRACT_ID: "${LEADERBOARD_CONTRACT_ID:-not-configured}"
      START_LEDGER: "${START_LEDGER:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    <<: *runtime-policy
    image: postgres:16.4-alpine
    cpus: "1.00"
    mem_limit: 1g
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ipredict}"
      POSTGRES_DB: "${POSTGRES_DB:-ipredict}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    <<: *runtime-policy
    image: redis:7.4-alpine
    cpus: "0.50"
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  log-collector:
    image: fluent/fluent-bit:3.1.9
    restart: always
    cpus: "0.25"
    mem_limit: 128m
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:24224:24224/udp"
    volumes:
      - ./logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - aggregated-logs:/var/log/ipredict
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  aggregated-logs:
