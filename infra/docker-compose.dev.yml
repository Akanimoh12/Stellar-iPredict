# Local development infrastructure: Postgres + Redis, plus an optional
# end-to-end profile that runs the app services in containers.
# During normal development the app services (api, indexer, oracle) run on the
# host via `npm run dev`. See docker-compose.production.yml for the full stack.
#
# End-to-end test: `npm run test:e2e:local` brings up Postgres and Redis with
# `docker compose -f docker-compose.dev.yml up -d --wait`, applies migrations,
# runs the scripted market lifecycle in `test/e2e/local-environment.ts`, and
# asserts the resulting database state. The stack is torn down on exit.
# Set KEEP_STACK=1 to keep the containers for debugging.
#
# To run the harness by hand against an already-running stack:
#   docker compose -f infra/docker-compose.dev.yml up -d --wait
#   DATABASE_URL=postgres://ipredict:ipredict@localhost:5432/ipredict npm run test:e2e:local:db

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ipredict
      POSTGRES_PASSWORD: ipredict
      POSTGRES_DB: ipredict
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipredict -d ipredict"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  redisdata:
